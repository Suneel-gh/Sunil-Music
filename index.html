<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rhythm South</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h2>Rhythm South</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search title, artist, language...">
      </div>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="stream">Online Songs</button>
      <button class="tab-btn" data-tab="playlists">My Playlists</button>
      <button class="tab-btn" data-tab="localFiles">Device Audio</button>
    </nav>

    <main class="content-panel">
      <!-- Online Feed -->
      <section id="streamTab" class="tab-content active">
        <div class="section-title">
          <h3>Telugu & Tamil Feed</h3>
          <button id="refreshFeedBtn" class="action-btn">Refresh</button>
        </div>
        <ul id="onlineTrackList" class="track-list"></ul>
      </section>

      <!-- Playlists -->
      <section id="playlistsTab" class="tab-content">
        <div class="playlist-create">
          <input type="text" id="newPlaylistName" placeholder="New Playlist Name">
          <button id="createPlaylistBtn" class="action-btn">Create</button>
        </div>
        <div id="playlistContainer"></div>
      </section>

      <!-- Local Songs -->
      <section id="localFilesTab" class="tab-content">
        <div class="upload-zone">
          <label class="file-label">
            <span>+ Pick Audio Files from Phone</span>
            <input type="file" id="filePicker" accept="audio/*" multiple>
          </label>
        </div>
        <ul id="localDeviceTrackList" class="track-list"></ul>
      </section>
    </main>

    <!-- Sticky Audio Player -->
    <footer class="player-bar">
      <audio id="audioElement"></audio>
      <div class="now-playing">
        <span id="playerTitle" class="title">Select a track</span>
        <span id="playerArtist" class="artist">Telugu / Tamil Music</span>
      </div>
      <div class="seek-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekBar" value="0" min="0" step="1">
        <span id="durationTime">0:00</span>
      </div>
      <div class="player-controls">
        <button id="prevBtn" class="ctrl-btn">⏮</button>
        <button id="playPauseBtn" class="ctrl-btn play-btn">▶</button>
        <button id="nextBtn" class="ctrl-btn">⏭</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
